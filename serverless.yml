service: snitch-serverless

frameworkVersion: "4"

plugins:
    - serverless-domain-manager
    - serverless-offline

package:
    patterns:
        - "!**/*"
        - "src/**"
        - "config/**"
        - "package.json"
        - "node_modules/**"

custom:
    stage: ${opt:stage, "production"}
    domains:
        production: snitch.ci.xola.com
    customDomain:
        basePath: ""
        domainName: ${self:custom.domains.${self:custom.stage}, "localhost"}
        stage: "${self:custom.stage}"
        createRoute53Record: true
    serverless-offline:
        port: 8832
        noPrependStageInUrl: true

provider:
    name: aws
    runtime: nodejs24.x
    region: us-east-1
    memorySize: 512
    timeout: 30
    environment:
        IS_SERVERLESS: true
        NODE_ENV: ${opt:stage, "production"}
        NODE_CONFIG_ENV: ${opt:stage, "production"}
    apiGateway:
        shouldStartNameWithService: true

functions:
    web:
        handler: src/index.default
        events:
            - http: GET /status
            - http: POST /api/webhooks
            - http: POST /api/actions
            - http: POST /slack/events # Bolt's default Events API / interactivity / slash-command endpoint

    monitorJobs:
        handler: src/monitor-jobs.handler
        events:
            # Mirrors the original */20 * * * 1-5 CronJob expression (server health, weekdays)
            - schedule: cron(0/20 * ? * MON-FRI *)

    monitorAgents:
        handler: src/monitor-elastic-agents.handler
        events:
            # Mirrors the original */45 * * * 1-5 CronJob expression (elastic agents, weekdays)
            - schedule: cron(0/45 * ? * MON-FRI *)
